# Qdrant, for the server-backed dense retrieval path.
#
# Not required to reproduce any result in this repo: the default dense backend
# uses qdrant-client's embedded mode (same client library, same API, no server),
# so `git clone && uv pip install && reval run` needs no Docker. Bring this up
# and set `indexing.qdrant.mode: server` in a config when you want the real
# thing — the retriever code is identical either way.
#
#   docker compose up -d
#   reval run --config configs/baseline.yaml --qdrant-mode server

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: reval-qdrant
    ports:
      - "6333:6333"  # REST / dashboard at http://localhost:6333/dashboard
      - "6334:6334"  # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      # Fail loudly rather than silently truncating oversized payloads.
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: 64
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
