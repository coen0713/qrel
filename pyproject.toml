[project]
name = "qrel"
version = "0.1.0"
description = "A retrieval evaluation harness with contamination detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Coen McFerson" }]
keywords = ["information-retrieval", "evaluation", "rag", "beir", "contamination"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "bm25s>=0.2",
    # Porter stemming for the BM25 baseline. BEIR's published BM25 numbers come
    # from Anserini with stemming on; without it our sparse baseline would be
    # weaker than the literature's for a reason unrelated to the comparison we
    # are actually making, which would quietly flatter the dense retrievers.
    "PyStemmer>=2.2",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Dense retrieval. Heavy (torch). Not needed for the metrics parity test.
dense = [
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
]
# Synthetic query generation for the contamination experiment.
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    # Wheel-shipping fork of pytrec_eval; imports as `pytrec_eval`.
    # The upstream `pytrec_eval` sdist needs a C++ toolchain, which makes CI
    # (and Windows laptops) unnecessarily painful for our highest-value test.
    "pytrec-eval-terrier>=0.5.6",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "ruff>=0.5",
]

[project.scripts]
reval = "reval.cli:app"

[project.urls]
Homepage = "https://github.com/Coen-McFerson/qrel"
Repository = "https://github.com/Coen-McFerson/qrel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a full corpus download or model inference",
    "network: hits the network",
    "dense: needs the [dense] extra (torch / sentence-transformers)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults. That is precisely how Typer
# declares arguments, so the rule is noise in the CLI layer and nowhere else.
"src/reval/cli*.py" = ["B008"]
