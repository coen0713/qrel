name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Action versions are held at the majors proven green on this repo.
# astral-sh/setup-uv@v10 exists as a tag but Actions could not resolve it
# ("unable to find version `v10`"), so newer majors get verified on a
# branch before landing here. The Node 20 deprecation notice these emit is
# a warning, not a failure.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # Without this, `uv pip install --system` targets the runner's
      # Debian-managed /usr and fails as "externally managed".
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the project rather than a bare `ruff`, so the linter version is
      # the one pinned in pyproject.toml. A floating ruff would eventually fail
      # `format --check` on an unrelated release, which is a confusing way for
      # CI to break.
      - name: Install
        run: uv pip install --system -e ".[dev]"

      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix deliberately: pytrec_eval is a C++ extension
        # and the reproduction instructions in the README claim to work there.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately only the [dev] extra: the parity test — the one that
      # guards every number in this repo — needs no torch, so the job that
      # protects our results stays fast.
      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Cache BEIR corpora
        uses: actions/cache@v4
        with:
          path: data/beir
          # Bump the suffix to force a re-download if a loader changes.
          key: beir-scifact-nfcorpus-fiqa-v1

      - name: Download corpora
        run: reval corpus download

      - name: M0 acceptance — loaders reproduce the published BEIR statistics
        run: |
          reval corpus stats scifact --strict
          reval corpus stats nfcorpus --strict
          reval corpus stats fiqa --strict

      - name: M1 acceptance — metrics match pytrec_eval to 1e-6
        run: pytest tests/test_metrics_parity.py -v

      - name: Full suite
        run: pytest -q
